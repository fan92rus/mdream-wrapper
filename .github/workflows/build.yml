name: Build and Publish NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build native DLL
        run: cargo build --release

      - name: Prepare native artifact
        run: |
          mkdir -p artifacts/win-x64
          cp target/release/mdream_wrapper.dll artifacts/win-x64/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build managed library
        run: dotnet build lib/MdreamWrapper.csproj -c Release -o artifacts/managed/net9.0

      - name: Install nuget.exe
        run: |
          $nugetPath = "$env:USERPROFILE\.nuget\local\nuget.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $nugetPath)
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nugetPath
          echo "$env:USERPROFILE\.nuget\local" | Out-File -Append $env:GITHUB_PATH

      - name: Pack NuGet
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          nuget pack MdreamWrapper.nuspec -OutputDirectory dist -Version $version

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/*.nupkg

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $pkg = Get-ChildItem dist/*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName `
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json `
            --api-key ${{ secrets.GITHUB_TOKEN }}
